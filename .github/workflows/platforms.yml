name: platforms
# DRAFT for review (ROADMAP, "Platform tests through cibuildwheel"). workflow_dispatch only works for a
# workflow on the default branch, so TEMPORARILY it also runs on a push to phase5 that touches the
# harness or this file (remove the push trigger when it lands on main). cibuildwheel builds the test-only harness (ci/harness) per platform and runs tests/ with the
# waboros wheel built from the repository root; the config is ci/harness/pyproject.toml.
# "proven" = the same recipe runs in a sibling natify-sh repository (py-wasmext, wabt-package);
# "new" = nobody has run it yet.
on:
  workflow_dispatch:
    inputs:
      exotic:
        description: also run the optional QEMU jobs (ppc64le, s390x, riscv64)
        type: boolean
        default: false
  push:
    branches: [phase5]
    paths: [ci/harness/**, .github/workflows/platforms.yml]
# its own group: never cancels the `ci` workflow
concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONUTF8: "1"
jobs:
  wheels:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # the Pythons, the bounds modes and the tests per platform are in ci/harness/pyproject.toml
        include:
          # one job per runner; the architectures of a platform go through CIBW_ARCHS below (the same as CIBW_ARCHS_<PLATFORM>, since a job has one platform)
          - { name: "Linux x86 (x86_64, i686)", os: ubuntu-latest, platform: linux, archs: "x86_64 i686" }  # proven: wabt-package
          - { name: "Linux arm (aarch64, armv7l)", os: ubuntu-24.04-arm, platform: linux, archs: "aarch64 armv7l" }  # proven; armv7l native here
          - { name: macOS arm64, os: macos-26, platform: macos, archs: arm64 }  # proven: wabt-package
          # a real Intel runner: under Rosetta jit-x86_64 and its fault handler would run translated
          - { name: macOS x86_64, os: macos-26-intel, platform: macos, archs: x86_64 }
          - { name: Windows x64, os: windows-latest, platform: windows, archs: AMD64 }  # proven: wabt-package
          - { name: Windows ARM64, os: windows-11-arm, platform: windows, archs: ARM64 }  # tests need native
          # tests on x86_64 (the emulator has the runner's architecture), arm64_v8a is built only
          # (test-skip in the config); proven: py-wasmext
          - { name: "Android (x86_64, arm64_v8a)", os: ubuntu-latest, platform: android, archs: "x86_64 arm64_v8a" }
          # pyc only; the build is proven by py-wasmext. ppc64le, riscv64, s390x and iOS are off
          # (maintainer, 2026-11-03): the same pyc as elsewhere, and no micro-compiler for them yet
          - { name: Pyodide, os: ubuntu-latest, platform: pyodide, archs: wasm32 }
    env:
      # Linux containers get theirs from the config (/project/ci/deps); the host runs need this one
      PIP_FIND_LINKS: ${{ matrix.platform != 'linux' && format('{0}/ci/deps', github.workspace) || '' }}
      UV_FIND_LINKS: ${{ matrix.platform != 'linux' && format('{0}/ci/deps', github.workspace) || '' }}
      CIBW_ARCHS: ${{ matrix.archs }}  # this job's platform only (--platform below); "x86_64 i686" = two
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # setuptools-scm: the version of the wheel under test must not be 0.0.0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      # UV_FIND_LINKS makes the `uv run` below read this directory, so it must exist; before-build fills it
      - run: mkdir -p ci/deps
        shell: bash
      # cibuildwheel comes from uv.lock (dev group); the host needs nothing else
      - run: uv run --only-group dev cibuildwheel ci/harness --platform ${{ matrix.platform }} --output-dir wheelhouse
        shell: bash
  # Optional, never on push, never counts against the run: the architectures that have only pyc (no
  # micro-compiler yet). Start it from the Actions tab with `exotic` ticked. QEMU is very slow, so
  # each emulated architecture has a runner of its own (armv7l is in the main arm job, natively).
  exotic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.exotic }}
    name: exotic ${{ matrix.archs }}
    continue-on-error: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360  # QEMU is slow
    strategy:
      fail-fast: false
      matrix:
        include:
          - { archs: ppc64le, os: ubuntu-latest, qemu: true }
          - { archs: s390x, os: ubuntu-latest, qemu: true }
          - { archs: riscv64, os: ubuntu-latest, qemu: true }
    env:
      CIBW_ARCHS: ${{ matrix.archs }}
      CIBW_BUILD: cp313-manylinux_*  # one Python, glibc only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - if: ${{ matrix.qemu }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
        with:
          platforms: all
      - run: mkdir -p ci/deps
      - run: uv run --only-group dev cibuildwheel ci/harness --platform linux --output-dir wheelhouse
