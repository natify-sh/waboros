name: diag-ubuntu26
# Temporary diagnostics for the two failures that appeared when ubuntu-latest became Ubuntu 26.04
# (2026-11-09): the SSE2-only QEMU step of `ci` (SIGILL at start) and the i686 manylinux container of
# `platforms` (pypi.org does not resolve). Prints facts only; removed once the cause is fixed.
on:
  push:
    branches: ["ci-ubuntu26"]
permissions:
  contents: read
jobs:
  sse2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --python 3.13
      - run: sudo apt-get install -y qemu-user file
      - name: facts
        run: |
          set -x
          cat /etc/os-release | head -3; uname -a; qemu-x86_64 --version | head -1
          cat /etc/ld.so.preload || true; env | grep -E '^(LD_|GLIBC_)' || true
          readlink -f .venv/bin/python; file -L .venv/bin/python
          grep -m1 'model name' /proc/cpuinfo; grep -m1 -o -w 'avx512f\|avx2\|sse4_2' /proc/cpuinfo | sort -u
      - name: host userland ISA level
        continue-on-error: true
        run: |
          set -x
          dpkg --print-architecture; dpkg --print-foreign-architectures || true
          /lib64/ld-linux-x86-64.so.2 --help | grep -iE 'subdirector|x86-64-v|supported' || true
          dpkg -S /bin/true; dpkg -s libc6 | grep -E 'Version|Architecture'; ls /etc/apt/sources.list.d; grep -rh "^Architectures\|amd64v" /etc/apt/ 2>/dev/null | head
      - name: SSE2-only qemu64 inside a container (generic amd64 userland)
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/w" -w /w ubuntu:latest sh -c 'apt-get update -qq >/dev/null && apt-get install -y -qq qemu-user python3 >/dev/null; Q="qemu-x86_64 -cpu qemu64,-pni,-ssse3,-sse4.1,-sse4.2,-popcnt"; $Q /bin/true; echo rc=$?; $Q /usr/bin/python3 -c "print(1)"; echo rc=$?'
      - name: run under SSE2-only qemu64
        continue-on-error: true
        run: |
          set +e
          Q="qemu-x86_64 -cpu qemu64,-pni,-ssse3,-sse4.1,-sse4.2,-popcnt"
          for cmd in /bin/true "/usr/bin/python3 -c pass" "$(readlink -f .venv/bin/python) -c pass" ".venv/bin/python -c pass"; do
            echo "== $cmd"; $Q $cmd; echo "rc=$?"
          done
          echo "== strace"; $Q -strace .venv/bin/python -c pass 2>&1 | tail -40
          echo "== last translated blocks"; $Q -d in_asm,nochain -D q.log .venv/bin/python -c pass; tail -60 q.log
  i686-dns:
    runs-on: ubuntu-latest
    steps:
      - name: dns in containers
        continue-on-error: true
        run: |
          set -x
          cat /etc/resolv.conf; cat /etc/docker/daemon.json || true; docker info 2>/dev/null | grep -iE 'version|dns|cgroup'
          for p in "quay.io/pypa/manylinux_2_28_x86_64" "--platform=linux/386 quay.io/pypa/manylinux_2_28_i686" "--platform=linux/386 i386/debian:bookworm"; do
            echo "== $p"
            docker run --rm $p sh -c 'cat /etc/resolv.conf; getent hosts pypi.org || echo NO-DNS; uname -m' || echo "docker rc=$?"
          done
          echo "== i686 with seccomp unconfined"
          docker run --rm --security-opt seccomp=unconfined --platform=linux/386 quay.io/pypa/manylinux_2_28_i686 sh -c 'getent hosts pypi.org || echo NO-DNS'
          echo "== i686 strace of getent"
          docker run --rm --platform=linux/386 quay.io/pypa/manylinux_2_28_i686 sh -c 'yum -q -y install strace >/dev/null 2>&1; strace -f getent hosts pypi.org 2>&1 | grep -E "socket|connect|EPERM|ENOSYS" | head -20' || true
