name: ci
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --python 3.14
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: python3 tools/check_docs.py
      - run: python3 tools/features.py --check
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15", "3.15t", "pypy3.11"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run pytest -q
      # the measured native stack bounds and the JIT's budget (D10), once; and on musl (128 KiB threads)
      - if: matrix.python == '3.13'
        run: uv run python tools/stack_info.py
      - if: matrix.python == '3.13'
        run: docker run --rm -v "$PWD:/w" -w /w python:3.13-alpine python tools/stack_info.py
  jit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --python 3.13
      # llvm-mc (encoder check) and objdump/objcopy (ISA check); the tests skip without them.
      - run: (command -v llvm-mc && command -v llvm-objcopy) || (sudo apt-get update && sudo apt-get install -y llvm binutils)
      - run: llvm-mc --version && llvm-objcopy --version | head -1 && objdump --version | head -1
      - run: uv run pytest tests/jit -v -rs
        env:
          WABOROS_JIT_REQUIRE: "1"  # a missing tool fails the job instead of skipping (tests/jit)
      # S0004: the aarch64 ABI and compiler tests under QEMU user mode, which enforces BTI (the
      # arm64 runner's CPU has none); about 1.5 min
      - run: sudo apt-get install -y qemu-user libc6-arm64-cross libgcc-s1-arm64-cross
      - run: uv python install cpython-3.13-linux-aarch64-gnu
      - run: python3 tools/run_arm64.py -m pytest tests/jit/test_abi_aarch64.py tests/jit/test_compiler.py tests/jit/test_compiler_aarch64.py tests/jit/test_tail.py -q
      # S0005: the v128 boundary tests and the NEON operators (5c, 5e1, 5e2) against pyc, BTI
      # enforced; about 2.5 min
      - run: python3 tools/run_arm64.py -m pytest tests/jit/test_simd_abi.py tests/jit/test_simd_aarch64.py -q
        env:
          WABOROS_JIT_REQUIRE: "1"
      # D24: every spec module and CoreMark compiled by jit-x86_64 has only x86-64-v1 instructions
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .cache/spec
          key: spec-${{ runner.os }}-${{ hashFiles('tests/spec/fetch.py', 'tests/spec/spectest.wat') }}
      - run: uv run python tests/spec/fetch.py
      # step 4e: the whole spec suite on jit-aarch64 with BTI enforced (call_indirect, tail calls
      # and jump tables land on their pads; simd/ since 5e2), in-process under QEMU; about 1 min
      - run: python3 tools/run_arm64.py -m tests.spec.run --engine jit-aarch64 --in-process
      # S0005: SIMD on an SSE2-only CPU (QEMU's qemu64 without SSE3/SSSE3/SSE4/popcnt: an
      # instruction above x86-64-v1 is a SIGILL); jit-x86_64 claims simd (5d3), so the explicit
      # `simd` run must pass whole and equal pyc's
      - run: qemu-x86_64 -cpu qemu64,-pni,-ssse3,-sse4.1,-sse4.2,-popcnt .venv/bin/python -m pytest tests/jit/test_simd_abi.py tests/jit/test_simd_x86.py -q
        env:
          WABOROS_JIT_REQUIRE: "1"
      - run: |
          qemu-x86_64 -cpu qemu64,-pni,-ssse3,-sse4.1,-sse4.2,-popcnt .venv/bin/python -m tests.spec.run --engine jit-x86_64 --in-process --json simd-qemu64.json simd > /dev/null
          uv run python tools/spec_diff.py pyc simd-qemu64.json simd
      - run: uv run python tools/isa_all.py
      # S0004: the same gate for the aarch64 code, cross-compiled here (never run; D35): ARMv8.0-A
      - run: uv run python tools/isa_all.py --target jit-aarch64
      # D35: the code of every module and CoreMark per target as a sha256 list; the `arm64` job
      # compiles the same modules on arm64 and diffs its lists with these (both ways)
      - run: |
          mkdir dump
          uv run python tools/jit_dump.py --target jit-aarch64 dump/x86-host-jit-aarch64.txt
          uv run python tools/jit_dump.py --target jit-x86_64 dump/x86-host-jit-x86_64.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: jit-dump-x86
          path: dump
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --python 3.13
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .cache/spec
          key: spec-${{ runner.os }}-${{ hashFiles('tests/spec/fetch.py', 'tests/spec/spectest.wat') }}
      - run: uv run python tests/spec/fetch.py
      - run: uv run python -m tests.spec.run --engine wasmtime --json spec-wasmtime.json
      - run: uv run python -m tests.spec.run --engine pyc --json spec-pyc.json
      - run: uv run python -m tests.spec.run --engine jit-x86_64 --json spec-jit-x86_64.json
      # executable memory forbidden (MDWE): `auto` must warn once and give pyc's numbers
      - run: uv run python tools/no_exec.py -- uv run python -m tests.spec.run --engine auto
  os:
    # Windows x64 and macOS x64 (Intel); arm64 runners come with jit-aarch64. tests/jit runs inside
    # pytest here: llvm-mc/objdump checks skip where the tools are absent (no WABOROS_JIT_REQUIRE).
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"  # Windows console code page
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-26-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --python 3.13
      - run: uv run pytest -q -rs --ignore=tests/jit
      # which JIT tests ran here, and the native stack bounds of the deepest-host case (D10)
      - run: uv run pytest tests/jit -v -rs
      - if: ${{ !cancelled() }}
        run: uv run pytest tests/jit/test_abi.py -v -s -k deepest
      - if: ${{ !cancelled() }}
        run: uv run python tools/stack_info.py
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .cache/spec
          key: spec-${{ runner.os }}-${{ hashFiles('tests/spec/fetch.py', 'tests/spec/spectest.wat') }}
      - run: uv run python tests/spec/fetch.py
      - run: uv run python -m tests.spec.run --engine wasmtime
      - run: uv run python -m tests.spec.run --engine pyc
  arm64:
    # jit-aarch64 step 4a (S0004): the encoder against llvm-mc, the trampolines and executable
    # memory (I-cache flush; Linux PROT_BTI on BTI CPUs; macOS MAP_JIT) on the three arm64 OSes.
    # The job fails unless this is a native arm64 process whose jit-aarch64 probe succeeds (an
    # x64 Python under emulation, or MAP_JIT refused by a hardened runtime, must be seen).
    needs: jit  # the x86-64 hash lists (artifact jit-dump-x86) for the cross-compilation diff
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --python 3.13
      # llvm-mc and llvm-objcopy for the encoder tests (WABOROS_JIT_REQUIRE=1 below)
      - if: runner.os == 'Linux'
        run: (command -v llvm-mc && command -v llvm-objcopy) || (sudo apt-get update && sudo apt-get install -y llvm)
      - if: runner.os == 'macOS'
        run: |
          command -v llvm-mc || brew list llvm >/dev/null 2>&1 || brew install llvm
          command -v llvm-mc || echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - if: runner.os == 'Windows'
        run: |
          command -v llvm-mc || [ -x "/c/Program Files/LLVM/bin/llvm-mc.exe" ] || choco install llvm -y --no-progress
          command -v llvm-mc || echo "C:\Program Files\LLVM\bin" >> "$GITHUB_PATH"
      - run: llvm-mc --version && llvm-objcopy --version | head -1
      # what this runner gives the JIT; fails unless native arm64 with a working probe
      - run: >-
          uv run python -W always -c "import platform, sys;
          from waboros.targets.base import TARGETS, target_order;
          from waboros.targets.jit.common import execmem;
          why = TARGETS['jit-aarch64']().probe();
          print(platform.machine(), sys.platform, 'probe:', why,
          'PROT_BTI:', getattr(execmem, '_PROT_BTI', None), 'auto:', target_order('auto'));
          sys.exit(platform.machine().lower() not in ('arm64', 'aarch64') or why is not None
          or target_order('auto') != ['jit-aarch64'])"
      # every tests/jit test runs or fails; only the x86-64 ISA checks are left out (they need
      # GNU objdump with x86-64, which these runners lack)
      - run: uv run pytest tests/jit -v -rs -k "not isa_check and not isa_levels"
        env:
          WABOROS_JIT_REQUIRE: "1"
      - if: ${{ !cancelled() }}
        run: uv run python tools/stack_info.py
      # step 4e: CoreMark on jit-aarch64, natively (the number for BENCHMARKS.md); it must pass
      # its self-check
      - run: |
          uv run python tools/run_coremark_jit.py poc/in/core.wasm --target jit-aarch64 | tee coremark.txt
          uv run python tools/run_coremark_jit.py --check coremark.txt
      # S0004 4c/4e: the spec suite on jit-aarch64 (0 unexpected) and with `auto` (selects
      # jit-aarch64 since 4e) on every arm64 OS (wasm-tools and wasmtime have wheels for all
      # three); Linux: MDWE (`auto` falls back to pyc), the ISA gate on the runner's own compile,
      # and D35 in both directions against the x86-64 job's lists
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .cache/spec
          key: spec-${{ runner.os }}-${{ hashFiles('tests/spec/fetch.py', 'tests/spec/spectest.wat') }}
      - run: uv run python tests/spec/fetch.py
      - run: uv run python -m tests.spec.run --engine jit-aarch64 --json spec-jit-aarch64.json
      - run: uv run python -m tests.spec.run --engine auto
      - if: runner.os == 'Linux'
        run: uv run python tools/no_exec.py -- uv run python -m tests.spec.run --engine auto
      - if: runner.os == 'Linux'
        run: uv run python tools/isa_all.py --target jit-aarch64
      - if: runner.os == 'Linux'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: jit-dump-x86
          path: x86-dump
      - if: runner.os == 'Linux'
        run: |
          mkdir dump
          uv run python tools/jit_dump.py --target jit-aarch64 dump/arm64-host-jit-aarch64.txt
          uv run python tools/jit_dump.py --target jit-x86_64 dump/arm64-host-jit-x86_64.txt
          diff x86-dump/x86-host-jit-aarch64.txt dump/arm64-host-jit-aarch64.txt
          diff x86-dump/x86-host-jit-x86_64.txt dump/arm64-host-jit-x86_64.txt
  macos-pythonorg:
    # ROADMAP phase 4, after 4e: does jit-aarch64 run under the python.org installer's CPython (a
    # notarized, hardened-runtime build) on Apple Silicon? Both answers pass this job as long as the
    # behaviour is right: the probe succeeds and the JIT tests pass, or the probe refuses, `auto`
    # gives ['pyc'] with exactly one JitUnavailableWarning that names the reason (D31). The
    # entitlements of the binary are printed so the log says why. No `needs:`; RISKS R2.
    runs-on: macos-latest
    env:
      PYTHONUTF8: "1"
      # The python.org macOS installer, pinned (sha256 of the downloaded file; python.org lists MD5
      # only), and it must carry Apple's signature of the Python Software Foundation.
      PY_VERSION: "3.13.17"
      PKG_SHA256: "3053592af66128269efab37fe7851a4894920b27c442aeec99ce4d34d17c07e3"
      PY_FW: /Library/Frameworks/Python.framework/Versions/3.13
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: install the python.org CPython
        run: |
          curl -fsSL -o python.pkg "https://www.python.org/ftp/python/$PY_VERSION/python-$PY_VERSION-macos11.pkg"
          echo "$PKG_SHA256  python.pkg" | shasum -a 256 -c -
          pkgutil --check-signature python.pkg | tee sig.txt
          grep -q "Developer ID Installer: Python Software Foundation" sig.txt || { echo "unexpected signer"; exit 1; }
          sudo installer -pkg python.pkg -target /
      - name: signature and entitlements (the question this job answers)
        run: |
          for b in "$PY_FW/bin/python3.13" "$PY_FW/Resources/Python.app/Contents/MacOS/Python"; do
            echo "== $b"
            codesign -dv --verbose=4 "$b" 2>&1 | grep -E "Identifier|flags|Authority|TeamIdentifier" || true
            codesign -d --entitlements - "$b" 2>&1 || true
          done
          "$PY_FW/bin/python3.13" -c "import platform, sys; print(sys.version, platform.machine())"
      - name: venv with that interpreter
        run: |
          echo UV_PROJECT_ENVIRONMENT=$PWD/.venv-po >> "$GITHUB_ENV"  # for the later steps
          UV_PROJECT_ENVIRONMENT=$PWD/.venv-po uv sync --python "$PY_FW/bin/python3.13"
          .venv-po/bin/python -c "import sys; print(sys.executable, sys.base_prefix)"
      - name: probe and auto, then the behaviour check
        run: |
          .venv-po/bin/python -W always - <<'PY'
          import platform, sys, warnings
          from waboros.targets.base import TARGETS, JitUnavailableWarning, target_order
          assert platform.machine() == "arm64", platform.machine()
          why = TARGETS["jit-aarch64"]().probe()
          print("probe:", why)
          with warnings.catch_warnings(record=True) as w:
              warnings.simplefilter("always")
              order = target_order("auto")
          msgs = [str(x.message) for x in w if x.category is JitUnavailableWarning]
          print("auto:", order, "warnings:", msgs)
          if why is None:
              print("RESULT: the JIT RUNS under the python.org CPython")
              assert order == ["jit-aarch64"] and not msgs
          else:
              print("RESULT: the JIT is REFUSED (", why, "); auto falls back to pyc")
              assert order == ["pyc"] and len(msgs) == 1 and why in msgs[0], (order, msgs)
          PY
      - name: tests
        run: |
          # probe ok: the JIT tests run and must pass; probe refused: they skip. No WABOROS_JIT_REQUIRE:
          # llvm-mc is not installed in this job, so the encoder checks skip either way.
          .venv-po/bin/python -m pytest tests/jit/test_probe.py tests/jit/test_execmem.py tests/jit/test_abi_aarch64.py -rs
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .cache/spec
          key: spec-${{ runner.os }}-${{ hashFiles('tests/spec/fetch.py', 'tests/spec/spectest.wat') }}
      - name: the spec suite with auto (jit-aarch64 or the pyc fallback; 0 unexpected either way)
        run: |
          .venv-po/bin/python tests/spec/fetch.py
          .venv-po/bin/python -m tests.spec.run --engine auto
  android:
    # Can jit-x86_64 map executable memory inside an Android app process (SELinux untrusted_app,
    # our mmap RW, write, mprotect RX path), and does waboros behave either way? CPython's own
    # testbed app (the python.org Android package; the recipe of cibuildwheel and CPython's CI)
    # on a Gradle-managed emulator, x86_64 with KVM. Both answers pass this job as long as the
    # behaviour is right (tools/android_check.py, same rule as macos-pythonorg). arm64: no job,
    # GitHub has no arm64 runner that can run the Android emulator (docs/TARGETS.md). RISKS R2.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # python.org Android package, pinned (sha256 of the downloaded file; python.org lists none)
      PY_ANDROID: "3.14.10"
      PKG_SHA256: "6ebda1fc3f28efc5861cad397254e8ce5d81ba4f83a3cb6a0c124c3826a0e14c"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: the python.org Android package (it carries android.py, the testbed and libpython)
        run: |
          curl -fsSL -o pkg.tar.gz "https://www.python.org/ftp/python/$PY_ANDROID/python-$PY_ANDROID-x86_64-linux-android.tar.gz"
          echo "$PKG_SHA256  pkg.tar.gz" | sha256sum -c -
          mkdir pkg && tar -xzf pkg.tar.gz -C pkg
          java -version && python3 --version && echo "ANDROID_HOME=$ANDROID_HOME"
      - name: stage the app's site-packages (pytest, waboros) and working directory (tests, tools, CoreMark)
        run: |
          python3 -m pip install --quiet --target stage/site-packages pytest  # pure Python wheels
          cp -r src/waboros stage/site-packages/
          mkdir -p stage/cwd/tools stage/cwd/poc/in
          cp tools/android_check.py tools/run_coremark_jit.py stage/cwd/tools/
          cp poc/in/core.wasm stage/cwd/poc/in/
          tar --exclude=spec --exclude=__pycache__ -cf - tests | tar -xf - -C stage/cwd
      # android.py enables KVM for the emulator on GitHub Actions itself, installs the SDK
      # packages and the system image through Gradle, boots the emulator, runs the app and
      # returns the exit code of the Python command. -v adds Gradle and logcat (SELinux avc lines).
      - name: run in the testbed app on the emulator (Android 15, API 35, x86_64)
        run: |
          set -o pipefail
          python3 pkg/android.py test --managed maxVersion -v --site-packages "$PWD/stage/site-packages" \
            --cwd "$PWD/stage/cwd" -- -m tools.android_check 2>&1 | tee android.log
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: android-log
          path: android.log
