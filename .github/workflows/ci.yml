name: ci
on: [push, pull_request]
# a newer push to the same ref cancels the run in progress (as in the other natify-sh repositories)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  # S0006, Linux musl x86-64 (job `jit`): inside `python:3.13-alpine` the row is detected and
  # `auto` gives guard pages, then the spec suite and the fault tests in guard mode. wasmtime's
  # musllinux wheel needs libgcc_s; the fault-map test disassembles with GNU objdump (binutils).
  # Not aarch64: jit-aarch64 needs libgcc's __clear_cache, absent from the stock image (S0006)
  MUSL_GUARD: |
    apk add -q libgcc binutils
    pip install -q --root-user-action=ignore --group dev
    export PYTHONPATH=src PYTHONDONTWRITEBYTECODE=1 WABOROS_JIT_REQUIRE=1
    python -c "import platform; from waboros.targets.base import TARGETS; from waboros.targets.jit.common import guard; t = TARGETS['jit-' + platform.machine()](); print(guard.host_row(), guard.wanted(t)); assert guard.host_row() == 'linux-musl' and guard.wanted(t)"
    export WABOROS_JIT_BOUNDS=guard
    python -m tests.spec.run --engine "jit-$(uname -m)"
    python -m pytest -p no:cacheprovider tests/jit/test_guard.py -v -rs
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --python 3.14
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: python3 tools/check_docs.py
      - run: python3 tools/features.py --check
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15", "3.15t", "pypy3.11"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run pytest -q
      # the measured native stack bounds and the JIT's budget (D10), once; and on musl (128 KiB threads)
      - if: matrix.python == '3.13'
        run: uv run python tools/stack_info.py
      - if: matrix.python == '3.13'
        run: docker run --rm -v "$PWD:/w" -w /w python:3.13-alpine python tools/stack_info.py
      # D44: the default is guard pages here (Linux glibc x86-64); explicit checks stay covered
      - if: matrix.python == '3.13'
        run: uv run pytest -q
        env:
          WABOROS_JIT_BOUNDS: explicit
      # D46: the pyc mode that carries f32/f64 as int bit patterns (the default only on 32-bit x86)
      - if: matrix.python == '3.13'
        run: uv run pytest -q tests/test_pyc.py tests/test_target_pyc.py tests/test_pyc_simd.py
        env:
          WABOROS_PYC_FBITS: "1"
  jit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --python 3.13
      # llvm-mc (encoder check) and objdump/objcopy (ISA check); the tests skip without them.
      - run: (command -v llvm-mc && command -v llvm-objcopy) || (sudo apt-get update && sudo apt-get install -y llvm binutils)
      - run: llvm-mc --version && llvm-objcopy --version | head -1 && objdump --version | head -1
      - run: uv run pytest tests/jit -v -rs
        env:
          WABOROS_JIT_REQUIRE: "1"  # a missing tool fails the job instead of skipping (tests/jit)
      # S0004: the aarch64 ABI and compiler tests under QEMU user mode, which enforces BTI (the
      # arm64 runner's CPU has none); about 1.5 min
      - run: sudo apt-get install -y qemu-user libc6-arm64-cross libgcc-s1-arm64-cross
      - run: uv python install cpython-3.13-linux-aarch64-gnu
      - run: python3 tools/run_arm64.py -m pytest tests/jit/test_abi_aarch64.py tests/jit/test_compiler.py tests/jit/test_compiler_aarch64.py tests/jit/test_tail.py -q
      # S0005: the v128 boundary tests and the NEON operators (5c, 5e1, 5e2) against pyc, BTI
      # enforced; about 2.5 min. Explicit bounds: QEMU TCG splits a straddling 16-byte store, so
      # guard mode may tear one (accepted, D45; `auto` gives guard in an aarch64 process)
      - run: python3 tools/run_arm64.py -m pytest tests/jit/test_simd_abi.py tests/jit/test_simd_aarch64.py -q
        env:
          WABOROS_JIT_REQUIRE: "1"
          WABOROS_JIT_BOUNDS: explicit
      # D24: every spec module and CoreMark compiled by jit-x86_64 has only x86-64-v1 instructions
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .cache/spec
          key: spec-${{ runner.os }}-${{ hashFiles('tests/spec/fetch.py', 'tests/spec/spectest.wat') }}
      - run: uv run python tests/spec/fetch.py
      # step 4e: the whole spec suite on jit-aarch64 with BTI enforced (call_indirect, tail calls
      # and jump tables land on their pads; simd/ since 5e2), in-process under QEMU; about 1 min.
      # Both bounds modes named (S0006 step 2), then the fault tests under QEMU (the subprocess
      # ones skip without binfmt; the arm64 runner runs them natively)
      - run: python3 tools/run_arm64.py -m tests.spec.run --engine jit-aarch64 --in-process
        env:
          WABOROS_JIT_BOUNDS: explicit
      - run: python3 tools/run_arm64.py -m tests.spec.run --engine jit-aarch64 --in-process
        env:
          WABOROS_JIT_BOUNDS: guard
      - run: python3 tools/run_arm64.py -m pytest tests/jit/test_guard.py -q -rs
        env:
          WABOROS_JIT_BOUNDS: guard
          WABOROS_JIT_REQUIRE: "1"
      # S0006: guard pages, named explicitly although `auto` (the default, D44) gives them here,
      # so a regression in the verified-row check cannot silently turn them off: the spec suite
      # with the fault handler doing the bounds checks, then the fault tests (foreign faults, a
      # broken chain, two copies of the package)
      - run: uv run python -m tests.spec.run --engine jit-x86_64
        env:
          WABOROS_JIT_BOUNDS: guard
      - run: uv run pytest tests/jit/test_guard.py -v -rs
        env:
          WABOROS_JIT_BOUNDS: guard
          WABOROS_JIT_REQUIRE: "1"
      # the same on Linux musl x86-64 (MUSL_GUARD above)
      - run: docker run --rm -v "$PWD:/w" -w /w -e MUSL_GUARD python:3.13-alpine sh -euxc "$MUSL_GUARD"
      # S0005: SIMD on an SSE2-only CPU (QEMU's qemu64 without SSE3/SSSE3/SSE4/popcnt: an
      # instruction above x86-64-v1 is a SIGILL); jit-x86_64 claims simd (5d3), so the explicit
      # `simd` run must pass whole and equal pyc's
      # explicit bounds: QEMU TCG splits wide stores, so guard mode may tear one (accepted, D45)
      - run: qemu-x86_64 -cpu qemu64,-pni,-ssse3,-sse4.1,-sse4.2,-popcnt .venv/bin/python -m pytest tests/jit/test_simd_abi.py tests/jit/test_simd_x86.py -q
        env:
          WABOROS_JIT_REQUIRE: "1"
          WABOROS_JIT_BOUNDS: explicit
      - run: |
          qemu-x86_64 -cpu qemu64,-pni,-ssse3,-sse4.1,-sse4.2,-popcnt .venv/bin/python -m tests.spec.run --engine jit-x86_64 --in-process --json simd-qemu64.json simd > /dev/null
          uv run python tools/spec_diff.py pyc simd-qemu64.json simd
        env:
          WABOROS_JIT_BOUNDS: explicit
      - run: uv run python tools/isa_all.py
      # S0004: the same gate for the aarch64 code, cross-compiled here (never run; D35): ARMv8.0-A
      - run: uv run python tools/isa_all.py --target jit-aarch64
      # D35: the code of every module and CoreMark per target as a sha256 list; the `arm64` job
      # compiles the same modules on arm64 and diffs its lists with these (both ways). The bounds
      # mode is named on both hosts (`auto` gives guard only in a process of the target's
      # architecture), and both modes are listed
      - run: |
          mkdir dump
          WABOROS_JIT_BOUNDS=guard uv run python tools/jit_dump.py --target jit-aarch64 dump/x86-host-jit-aarch64.txt
          WABOROS_JIT_BOUNDS=explicit uv run python tools/jit_dump.py --target jit-aarch64 dump/x86-host-jit-aarch64-explicit.txt
          WABOROS_JIT_BOUNDS=guard uv run python tools/jit_dump.py --target jit-x86_64 dump/x86-host-jit-x86_64.txt
          WABOROS_JIT_BOUNDS=explicit uv run python tools/jit_dump.py --target jit-x86_64 dump/x86-host-jit-x86_64-explicit.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: jit-dump-x86
          path: dump
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --python 3.13
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .cache/spec
          key: spec-${{ runner.os }}-${{ hashFiles('tests/spec/fetch.py', 'tests/spec/spectest.wat') }}
      - run: uv run python tests/spec/fetch.py
      - run: uv run python -m tests.spec.run --engine wasmtime --json spec-wasmtime.json
      - run: uv run python -m tests.spec.run --engine pyc --json spec-pyc.json
      # D46: the same with f32/f64 carried as int bit patterns (the default only on 32-bit x86)
      - run: uv run python -m tests.spec.run --engine pyc
        env:
          WABOROS_PYC_FBITS: "1"
      - run: uv run python -m tests.spec.run --engine jit-x86_64 --json spec-jit-x86_64.json
      # D44: the default above is guard pages; explicit checks stay covered
      - run: uv run python -m tests.spec.run --engine jit-x86_64
        env:
          WABOROS_JIT_BOUNDS: explicit
      # S0011 steps 1-3: the bounds checks written once (`WABOROS_JIT_TWOLEVEL=1`), both modes
      - run: for b in guard explicit; do WABOROS_JIT_BOUNDS=$b uv run python -m tests.spec.run --engine jit-x86_64; done
        env:
          WABOROS_JIT_TWOLEVEL: "1"
      # executable memory forbidden (MDWE): `auto` must warn once and give pyc's numbers
      - run: uv run python tools/no_exec.py -- uv run python -m tests.spec.run --engine auto
  arm64:
    # jit-aarch64 step 4a (S0004): the encoder against llvm-mc, the trampolines and executable
    # memory (I-cache flush; PROT_BTI on BTI CPUs) on Linux arm64. macOS and Windows (x64 and arm64),
    # Android and the python.org CPython are tested by platforms.yml (cibuildwheel), not here.
    # The job fails unless this is a native arm64 process whose jit-aarch64 probe succeeds.
    needs: jit  # the x86-64 hash lists (artifact jit-dump-x86) for the cross-compilation diff
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --python 3.13
      # llvm-mc and llvm-objcopy for the encoder tests (WABOROS_JIT_REQUIRE=1 below)
      - run: (command -v llvm-mc && command -v llvm-objcopy) || (sudo apt-get update && sudo apt-get install -y llvm)
      - run: llvm-mc --version && llvm-objcopy --version | head -1
      # what this runner gives the JIT; fails unless native arm64 with a working probe
      - run: >-
          uv run python -W always -c "import platform, sys;
          from waboros.targets.base import TARGETS, target_order;
          from waboros.targets.jit.common import execmem;
          why = TARGETS['jit-aarch64']().probe();
          print(platform.machine(), sys.platform, 'probe:', why,
          'PROT_BTI:', getattr(execmem, '_PROT_BTI', None), 'auto:', target_order('auto'));
          sys.exit(platform.machine().lower() not in ('arm64', 'aarch64') or why is not None
          or target_order('auto') != ['jit-aarch64'])"
      # every tests/jit test runs or fails; only the x86-64 ISA checks and the x86-64 handler's
      # disassembly are left out (they need GNU objdump with x86-64, which these runners lack).
      # Explicit bounds: Arm may tear a straddling 16-byte store in guard mode (D45), which
      # test_simd_abi compares; guard mode is covered by the spec suite and test_guard.py below
      - run: uv run pytest tests/jit -v -rs -k "not isa_check and not isa_levels and not decode_and_reassemble"
        env:
          WABOROS_JIT_REQUIRE: "1"
          WABOROS_JIT_BOUNDS: explicit
      - if: ${{ !cancelled() }}
        run: uv run python tools/stack_info.py
      # step 4e: CoreMark on jit-aarch64, natively (the number for BENCHMARKS.md); it must pass
      # its self-check
      - run: |
          uv run python tools/run_coremark_jit.py poc/in/core.wasm --target jit-aarch64 | tee coremark.txt
          uv run python tools/run_coremark_jit.py --check coremark.txt
      # S0006: guard pages against explicit checks on native aarch64 (guard is the default here,
      # chosen on the x86-64 measurement); alternated, twice each, to see the runner's noise
      - run: |
          for i in 1 2; do for b in guard explicit; do
            echo "== $b run $i"
            WABOROS_JIT_BOUNDS=$b uv run python tools/run_coremark_jit.py poc/in/core.wasm --target jit-aarch64 | grep -E "Iterations/Sec|Correct"
          done; done
      # S0004 4c/4e: the spec suite on jit-aarch64 (0 unexpected) and with `auto` (selects
      # jit-aarch64 since 4e); MDWE (`auto` falls back to pyc), the ISA gate on the runner's own compile,
      # and D35 in both directions against the x86-64 job's lists
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .cache/spec
          key: spec-${{ runner.os }}-${{ hashFiles('tests/spec/fetch.py', 'tests/spec/spectest.wat') }}
      - run: uv run python tests/spec/fetch.py
      - run: uv run python -m tests.spec.run --engine jit-aarch64 --json spec-jit-aarch64.json
      - run: uv run python -m tests.spec.run --engine auto
      # S0006 step 2: Linux glibc aarch64 is a verified row (`auto` above gives guard pages
      # there); both modes named, the fault tests natively (foreign faults, chains, two copies),
      # (tests/jit runs in explicit mode above)
      - run: uv run python -m tests.spec.run --engine jit-aarch64
        env:
          WABOROS_JIT_BOUNDS: guard
      - run: uv run python -m tests.spec.run --engine jit-aarch64
        env:
          WABOROS_JIT_BOUNDS: explicit
      # S0011 steps 1-3: the bounds checks written once, natively, both modes
      - run: for b in guard explicit; do WABOROS_JIT_BOUNDS=$b uv run python -m tests.spec.run --engine jit-aarch64; done
        env:
          WABOROS_JIT_TWOLEVEL: "1"
      - run: uv run pytest tests/jit/test_guard.py -v -rs
        env:
          WABOROS_JIT_BOUNDS: guard
          WABOROS_JIT_REQUIRE: "1"
      - run: uv run python tools/no_exec.py -- uv run python -m tests.spec.run --engine auto
      - run: uv run python tools/isa_all.py --target jit-aarch64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: jit-dump-x86
          path: x86-dump
      - run: |
          mkdir dump
          WABOROS_JIT_BOUNDS=guard uv run python tools/jit_dump.py --target jit-aarch64 dump/arm64-host-jit-aarch64.txt
          WABOROS_JIT_BOUNDS=explicit uv run python tools/jit_dump.py --target jit-aarch64 dump/arm64-host-jit-aarch64-explicit.txt
          WABOROS_JIT_BOUNDS=guard uv run python tools/jit_dump.py --target jit-x86_64 dump/arm64-host-jit-x86_64.txt
          WABOROS_JIT_BOUNDS=explicit uv run python tools/jit_dump.py --target jit-x86_64 dump/arm64-host-jit-x86_64-explicit.txt
          diff x86-dump/x86-host-jit-aarch64.txt dump/arm64-host-jit-aarch64.txt
          diff x86-dump/x86-host-jit-aarch64-explicit.txt dump/arm64-host-jit-aarch64-explicit.txt
          diff x86-dump/x86-host-jit-x86_64.txt dump/arm64-host-jit-x86_64.txt
          diff x86-dump/x86-host-jit-x86_64-explicit.txt dump/arm64-host-jit-x86_64-explicit.txt
