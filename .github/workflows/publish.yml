name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Override version for a build-only manual run"
        required: false
        type: string
        default: ""

run-name: >
  ${{ github.event_name == 'push' && 'Build & Publish PyPI' || 'Build' }}

permissions:
  contents: read

# one release per ref at a time; a running publish is never cancelled half-way
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0 # setuptools_scm needs tags
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Build (the wheel is built from the sdist, so this proves the sdist builds on its own)
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ inputs.version }}
          # PyPI rejects local version segments (+g<hash>); keep them on build-only runs.
          SETUPTOOLS_SCM_OVERRIDES_FOR_WABOROS: >-
            ${{ github.event_name == 'push' && '{local_scheme = "no-local-version"}' || '' }}
        run: uv build --out-dir dist

      - name: Smoke-test the wheel in a clean environment
        run: |
          uv venv -q /tmp/smoke
          uv pip install -q --python /tmp/smoke dist/*.whl
          cd /tmp && /tmp/smoke/bin/python -c "import waboros; print('ok', waboros.__version__)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 14

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          skip-existing: true

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist # by name: without one, a single artifact is put straight into `path`
          path: artifacts/dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "waboros ${{ github.ref_name }}" \
            --generate-notes \
            artifacts/dist/*
